[package]
name = "game-launcher"
version = "1.1.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Lutris keeps its library in SQLite (pga.db).
[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
