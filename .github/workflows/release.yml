# Bump a plugin's `version` in its Cargo.toml and in index.json (which also holds its display text) and merge to master to ship it. Every push builds
# the plugins whose index.json version changed (scripts/plan.mjs), each on its own OS, and publishes a GitHub
# Release tagged with the UTC date and time (v2026.11.02-2341). The release always holds every
# plugin: the ones that did not change are copied over from the previous release (scripts/registry.mjs).
# Linux packages build on ubuntu-22.04 (glibc 2.35) so they run on Debian 12+, Ubuntu 22.04+ and Arch.
# Each plugin ships as <dir>_<os>_<version>.knobdeck (plus its readme; icons are hot-linked from the repo), and the release has one
# registry.json describing them all; the website repo pulls that on its own schedule. Pull requests only build.
# Running it by hand (Actions > release > Run workflow) rebuilds and republishes every plugin at its current
# version, e.g. after changing a build-time variable such as a token URL.
name: release
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          prev=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          mkdir prev
          # A release without registry.json (made before this scheme) counts as no previous release.
          if [ -n "$prev" ]; then gh release download "$prev" -p registry.json -D prev || true; fi
          if [ ! -f prev/registry.json ]; then prev=""; fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          # A manual run plans against no previous registry, so every plugin is built.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then reg=none; else reg=prev/registry.json; fi
          echo "matrix=$(node scripts/plan.mjs $reg)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        # macOS plugins ship as universal binaries (knobdeck-plugin build lipos both).
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # knobdeck-plugin packages with bsdtar; Ubuntu's tar is GNU tar, which can't write zip.
      - name: Linux packaging tools
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install knobdeck-plugin
        run: cargo install --git https://github.com/HarshalKudale/knobdeck-sdk --bin knobdeck-plugin --locked
      - name: Discord build-time settings
        shell: bash
        run: |
          printf 'DISCORD_CLIENT_ID=%s\n' '${{ vars.DISCORD_CLIENT_ID }}' > discord/.env
      - name: Package plugins
        shell: bash
        # App credentials baked in at build time (option_env!); unset ones leave the plugin asking for its own in setup.
        env:
          VOICEMOD_CLIENT_KEY: ${{ vars.VOICEMOD_CLIENT_KEY }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          # No Google secret here: the website's token endpoint adds it server-side.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          KNOBDECK_GOOGLE_TOKEN_URL: ${{ vars.KNOBDECK_GOOGLE_TOKEN_URL }}
          TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID }}
        run: |
          for d in ${{ matrix.plugins }}; do
            (cd "$d" && knobdeck-plugin build && knobdeck-plugin package)
          done
          node scripts/stage.mjs ${{ matrix.name }} ${{ matrix.plugins }}
      - uses: actions/upload-artifact@v4
        with: { name: "bundles-${{ matrix.name }}", path: "out/*" }
  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bundles-*", path: out, merge-multiple: true }
      - name: Build registry.json (adds the unchanged plugins from the previous release)
        run: |
          if [ -n "${{ needs.plan.outputs.prev }}" ]; then
            mkdir prev
            gh release download "${{ needs.plan.outputs.prev }}" -p registry.json -D prev
            node scripts/registry.mjs "${{ needs.plan.outputs.tag }}" "${{ needs.plan.outputs.prev }}" prev/registry.json
          else
            node scripts/registry.mjs "${{ needs.plan.outputs.tag }}"
          fi
      - name: Release
        run: gh release create "${{ needs.plan.outputs.tag }}" out/* --target "$GITHUB_SHA" --generate-notes
