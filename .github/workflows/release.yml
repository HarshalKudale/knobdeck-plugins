# Bump a plugin's `version` in its Cargo.toml (the only place it is written) and merge to master to
# ship it. Every push builds the plugins that have no <dir>-v<version> release yet (scripts/plan.mjs),
# each on its own OS, with the org's reusable workflow
# (Knobdeck/.github/.github/workflows/build-plugin.yml), then:
#  1. publishes one release per built plugin, tagged <dir>-v<version> (scripts/release-plugins.mjs),
#     never marked Latest; the catalog in knobdeck-registry is the only "latest";
#  2. sends a `plugin-released` dispatch to knobdeck-registry so the catalog updates right away (needs
#     the KnobDeck Catalog GitHub App: variable CATALOG_APP_ID + secret CATALOG_APP_PRIVATE_KEY;
#     without them the catalog's nightly run picks the release up).
# Linux packages build on ubuntu-22.04 (glibc 2.35) so they run on Debian 12+, Ubuntu 22.04+ and Arch.
# Pull requests only build. Running it by hand retries plugins whose release is missing (a released
# version is never rebuilt: bump the version to ship a new build, e.g. after changing a build-time variable).
name: release
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          gh release list --limit 1000 --json tagName -q '.[].tagName' > tags.txt
          matrix=$(node scripts/plan.mjs tags.txt)
          # A pull request that bumps nothing still builds one small plugin on every OS, so changes to
          # the workflows themselves get exercised.
          if [ "${{ github.event_name }}" = pull_request ] && [ "$matrix" = '{"include":[]}' ]; then
            matrix='{"include":[{"os":"windows-latest","name":"windows","plugins":"clocks"},{"os":"macos-latest","name":"macos","plugins":"clocks"},{"os":"ubuntu-22.04","name":"linux","plugins":"clocks"}]}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: Knobdeck/.github/.github/workflows/build-plugin.yml@main
    with:
      os: ${{ matrix.name }}
      runner: ${{ matrix.os }}
      plugins: ${{ matrix.plugins }}
      # TODO: turn on once `knobdeck-plugin conform` finishes for every plugin (it hangs on discord).
      conform: false
      attest: ${{ github.event_name != 'pull_request' }}
  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bundles-*", path: out, merge-multiple: true }
      - name: Per-plugin releases
        run: node scripts/release-plugins.mjs "$GITHUB_SHA"
      - name: Catalog app token
        id: app
        if: vars.CATALOG_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: Knobdeck
          repositories: knobdeck-registry
      - name: Tell the catalog
        if: steps.app.outputs.token != '' && hashFiles('out/released.json') != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          jq -n --slurpfile r out/released.json --arg repo "$GITHUB_REPOSITORY" \
            '{event_type: "plugin-released", client_payload: {repo: $repo, plugins: $r[0]}}' |
            gh api repos/Knobdeck/knobdeck-registry/dispatches --input -
