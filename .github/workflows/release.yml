# Bump a plugin's `version` in its Cargo.toml (the only place it is written) and merge to master to
# ship it. Every push builds the plugins whose version differs from the previous snapshot release
# (scripts/plan.mjs), each on its own OS, with the org's reusable workflow
# (Knobdeck/.github/.github/workflows/build-plugin.yml), then publishes:
#  1. one release per built plugin, tagged <dir>-v<version> (scripts/release-plugins.mjs), never
#     marked Latest; the catalog in knobdeck-registry reads these;
#  2. the date-tagged snapshot release (v2026.11.02-2341) holding every plugin, unchanged ones
#     copied over from the previous one (scripts/registry.mjs). Kept until the catalog serves
#     /plugins/registry.json (PLUGIN_INFRA_PLAN.md §10), then dropped;
#  3. a `plugin-released` dispatch to knobdeck-registry so the catalog updates right away (needs
#     the KnobDeck Catalog GitHub App: variable CATALOG_APP_ID + secret CATALOG_APP_PRIVATE_KEY;
#     without them the catalog's nightly run picks the release up).
# Linux packages build on ubuntu-22.04 (glibc 2.35) so they run on Debian 12+, Ubuntu 22.04+ and Arch.
# Pull requests only build. Running it by hand (Actions > release > Run workflow) rebuilds every
# plugin into a new snapshot release (e.g. after changing a build-time variable); per-plugin
# releases that already exist are not touched.
name: release
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
      prev: ${{ steps.plan.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          # The previous snapshot release (date tag); per-plugin releases (<dir>-v<version>) are never Latest.
          prev=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          mkdir prev
          # A release without registry.json (made before this scheme) counts as no previous release.
          if [ -n "$prev" ]; then gh release download "$prev" -p registry.json -D prev || true; fi
          if [ ! -f prev/registry.json ]; then prev=""; fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          # A manual run plans against no previous registry, so every plugin is built.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then reg=none; else reg=prev/registry.json; fi
          echo "matrix=$(node scripts/plan.mjs $reg)" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: Knobdeck/.github/.github/workflows/build-plugin.yml@main
    with:
      os: ${{ matrix.name }}
      runner: ${{ matrix.os }}
      plugins: ${{ matrix.plugins }}
      # TODO: turn on once `knobdeck-plugin conform` finishes for every plugin (it hangs on discord).
      conform: false
      attest: ${{ github.event_name != 'pull_request' }}
  publish:
    needs: [plan, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "bundles-*", path: out, merge-multiple: true }
      - name: Per-plugin releases
        run: node scripts/release-plugins.mjs "$GITHUB_SHA"
      - name: Build registry.json (adds the unchanged plugins from the previous release)
        run: |
          if [ -n "${{ needs.plan.outputs.prev }}" ]; then
            mkdir prev
            gh release download "${{ needs.plan.outputs.prev }}" -p registry.json -D prev
            node scripts/registry.mjs "${{ needs.plan.outputs.tag }}" "${{ needs.plan.outputs.prev }}" prev/registry.json
          else
            node scripts/registry.mjs "${{ needs.plan.outputs.tag }}"
          fi
      - name: Snapshot release
        run: |
          mv out/released.json released.json
          gh release create "${{ needs.plan.outputs.tag }}" out/* --target "$GITHUB_SHA" --generate-notes --latest
      - name: Catalog app token
        id: app
        if: vars.CATALOG_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          owner: Knobdeck
          repositories: knobdeck-registry
      - name: Tell the catalog
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          jq -n --slurpfile r released.json --arg repo "$GITHUB_REPOSITORY" \
            '{event_type: "plugin-released", client_payload: {repo: $repo, plugins: $r[0]}}' |
            gh api repos/Knobdeck/knobdeck-registry/dispatches --input -
