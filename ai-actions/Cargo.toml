[package]
name = "ai-actions"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk = { workspace = true, features = ["secrets", "placeholders"] }
ureq.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-desktop = { path = "../linux-desktop" }
