<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VS Code Setup</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1218;
      --panel: #171c25;
      --border: #2a3240;
      --text: #f4f6f8;
      --muted: #a2acb9;
      --accent: #4f8cff;
      --accent-hover: #3b74df;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 Inter, Segoe UI, system-ui, sans-serif;
    }
    .card {
      width: min(440px, calc(100vw - 32px));
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
    }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 14px; color: var(--muted); }
    .note {
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font-size: 12px;
    }
    .grid { display: grid; gap: 12px; }
    .row { display: grid; grid-template-columns: 1fr 120px; gap: 12px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      background: #202735;
      color: var(--text);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.7; cursor: wait; }
    .status { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .status.error { color: var(--danger); }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <form class="card" id="setup-form">
    <h1>VS Code Setup</h1>
    <p>Connect KnobDeck to the VS Code companion extension.</p>
    <div class="note">
      Install the <b>KnobDeck VS Code Companion</b> extension from the Visual Studio Marketplace or Open VSX. It starts on port 32145; if you set a password or another port in its settings, use the same values here.
    </div>
    <div class="grid">
      <div class="row">
        <label>
          Host
          <input id="host" type="text" value="127.0.0.1" autocomplete="off">
        </label>
        <label>
          Port
          <input id="port" type="number" value="32145" min="1" max="65535" autocomplete="off">
        </label>
      </div>
      <label>
        Password
        <input id="password" type="password" placeholder="Optional companion password" autocomplete="off">
      </label>
      <button id="save-btn" type="submit">Save VS Code Setup</button>
      <div id="status" class="status"></div>
    </div>
  </form>
  <script>
    const form = document.getElementById('setup-form');
    const host = document.getElementById('host');
    const port = document.getElementById('port');
    const password = document.getElementById('password');
    const button = document.getElementById('save-btn');
    const status = document.getElementById('status');

    function setStatus(text, kind = '') {
      status.textContent = text;
      status.className = `status ${kind}`.trim();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      button.disabled = true;
      setStatus('Verifying VS Code companion connection...');
      window.parent.postMessage({
        source: 'knobdeck-setup-page',
        type: 'setup-submit',
        values: {
          host: host.value.trim(),
          port: port.value.trim(),
          password: password.value,
        },
      }, '*');
    });

    window.addEventListener('message', (event) => {
      const data = event && event.data;
      if (!data || data.source !== 'knobdeck-host') return;
      if (data.type === 'setup-complete') {
        setStatus('VS Code setup saved.');
        button.disabled = false;
      } else if (data.type === 'setup-failed') {
        setStatus(data.message || 'Setup failed.', 'error');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
