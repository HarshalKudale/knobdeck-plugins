[package]
name = "hardware-monitor"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk.workspace = true
base64.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
