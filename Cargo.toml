[workspace]
resolver = "2"
members = ["zoom", "vlc", "vscode", "intellij", "obs", "browser-plugin", "discord", "win-tools", "mac-tools", "ai-stats", "elgato-lights", "weather", "clocks", "streamlabs", "voicemod", "spotify", "twitch", "youtube", "linux-desktop", "linux-tools", "home-assistant", "hue", "game-launcher", "ytmusic", "slides"]

[workspace.dependencies]
knobdeck-sdk = { git = "https://github.com/HarshalKudale/knobdeck-sdk.git" }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
sha2 = "0.10"
# D-Bus for the Linux plugins (pure Rust: no libdbus at run time).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
