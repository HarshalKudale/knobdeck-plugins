[package]
name = "spotify"
version = "1.2.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk = { workspace = true, features = ["oauth"] }
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-desktop = { path = "../linux-desktop" }
zbus.workspace = true
