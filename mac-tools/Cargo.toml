[package]
name = "mac-tools"
version = "1.1.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk.workspace = true
base64.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSData", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSScreen", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }
