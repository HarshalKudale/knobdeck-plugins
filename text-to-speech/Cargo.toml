[package]
name = "text-to-speech"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk = { workspace = true, features = ["placeholders"] }
serde_json.workspace = true

# Windows: WinRT SpeechSynthesizer (every installed voice, natural ones included) played through
# a MediaPlayer. macOS uses the system `say` (the Speech Synthesis voices); Linux speaks Speech
# Dispatcher's SSIP over its Unix socket in pure Rust (no libspeechd at build or run time).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_Com"] }
