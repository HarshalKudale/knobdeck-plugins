[package]
name = "home-assistant"
version = "1.2.1"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk = { workspace = true, features = ["secrets"] }
ureq.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
# wss:// for Home Assistant behind TLS (Nabu Casa, a reverse proxy): rustls with the ring provider,
# the same roots ureq trusts for the REST calls.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
