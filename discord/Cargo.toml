[package]
name = "discord"
version = "1.2.0"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
knobdeck-sdk.workspace = true
ureq.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom = "0.2"

# The sign-in lives in the OS credential store (see src/common.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Secret Service over zbus (pure Rust, no libdbus), like the workspace's other D-Bus code.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "async-io", "crypto-rust"] }
