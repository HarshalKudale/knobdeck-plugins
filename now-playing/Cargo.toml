[package]
name = "now-playing"
version = "1.0.1"
edition = "2021"
publish = false

[dependencies]
knobdeck-sdk.workspace = true
ureq.workspace = true
base64.workspace = true
# Album art is shrunk to key size before it is sent to KnobDeck.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-desktop = { path = "../linux-desktop" }
zbus.workspace = true
